name: Full-Client Release (Web / App / PC)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  pre-release-check:
    name: Run Quality & Pipeline Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm -w @ledger/shared test

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client
        run: npm run build:client

      - name: Verify Build Configurations
        run: node scripts/verify-build-pipeline.mjs

  package-web:
    name: Package Web PWA
    needs: [pre-release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client
        run: npm run build:client

      - name: Zip Web Dist
        run: |
          mkdir -p release-web
          cd packages/client/dist
          zip -r ../../../release-web/ServerlessLedger-Web-PWA.zip .
          cd -

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-bundle
          path: release-web/*

  package-android:
    name: Package Android APK
    needs: [pre-release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client Dist
        run: npm run build:client

      - name: Add & Sync Capacitor Android
        working-directory: packages/client
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node ../../scripts/sync-android-widget.mjs

      - name: Make Gradlew Executable
        run: chmod +x packages/client/android/gradlew

      # 添加签名配置（若存在 Secrets 则解码，否则正常打包未签名版）
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > android-release-key.jks
          fi

      - name: Build APKs
        working-directory: packages/client/android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sign & Collect Android Artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-android
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)"

          UNSIGNED_APK="packages/client/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="release-android/ServerlessLedger_3.0.0_Android_arm64.apk"

          if [ -f "$UNSIGNED_APK" ] && [ -f android-release-key.jks ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "--- 对齐 APK (zipalign) ---"
            $BUILD_TOOLS_PATH/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK"

            echo "--- 签名 APK (apksigner) ---"
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks android-release-key.jks \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              "$SIGNED_APK"

            echo "--- 验证签名 ---"
            $BUILD_TOOLS_PATH/apksigner verify --verbose "$SIGNED_APK"
          elif [ -f "$UNSIGNED_APK" ]; then
            cp "$UNSIGNED_APK" release-android/ServerlessLedger_3.0.0_Android_arm64.apk
          fi

          # 坚决不输出 idsig 和 debug 文件
          rm -f release-android/*.idsig release-android/*Debug* release-android/*debug*
          ls -la release-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apks
          path: release-android/*.apk

  package-desktop:
    name: Package PC Desktop (${{ matrix.platform.os }} - ${{ matrix.platform.target }})
    needs: [pre-release-check]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-AppleSilicon
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux System Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/client/src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client Dist
        run: npm run build:client

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/client
          args: --target ${{ matrix.platform.target }}

      - name: Collect Desktop Binaries
        shell: bash
        run: |
          mkdir -p release-desktop-${{ matrix.platform.name }}
          find packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/ -type f \( -iname "*.msi" -o -iname "*.exe" -o -iname "*.dmg" -o -iname "*.deb" -o -iname "*.appimage" \) -exec cp {} release-desktop-${{ matrix.platform.name }}/ \; || true
          ls -la release-desktop-${{ matrix.platform.name }}/ || true

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform.name }}
          path: release-desktop-${{ matrix.platform.name }}/*

  package-ios:
    name: Package iOS App
    needs: [pre-release-check]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client Dist
        run: npm run build:client

      - name: Add & Sync Capacitor iOS
        working-directory: packages/client
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods Dependencies
        working-directory: packages/client/ios/App
        run: |
          pod install --repo-update

      - name: Build iOS App (Generic Device, No Signing)
        working-directory: packages/client/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build

      - name: Package iOS Build Artifacts
        run: |
          mkdir -p release-ios
          APP_PATH="packages/client/ios/App/build/Build/Products/Release-iphoneos/App.app"
          if [ -d "$APP_PATH" ]; then
            (cd "$(dirname "$APP_PATH")" && zip -r "$GITHUB_WORKSPACE/release-ios/ServerlessLedger_3.0.0_iOS.zip" App.app)
            PAYLOAD_DIR="$RUNNER_TEMP/Payload"
            mkdir -p "$PAYLOAD_DIR"
            cp -r "$APP_PATH" "$PAYLOAD_DIR/"
            (cd "$RUNNER_TEMP" && zip -r "$GITHUB_WORKSPACE/release-ios/ServerlessLedger_3.0.0_iOS.ipa" Payload)
          else
            tar -czvf release-ios/ServerlessLedger_3.0.0_iOS_Project.tar.gz -C packages/client/ios App
          fi
          ls -la release-ios/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-bundle
          path: release-ios/*

  publish-full-release:
    name: Publish Full-Client Release & Checksums
    needs: [package-web, package-android, package-desktop, package-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Prepare Final Release Directory & Compute Checksums
        run: |
          mkdir -p release-assets

          # 1. Android (正式签名包，排查 debug 及 idsig)
          find all-dist/release-android-apks -type f -name "*.apk" ! -name "*Debug*" ! -name "*debug*" -exec cp {} release-assets/ServerlessLedger_3.0.0_Android_arm64.apk \;

          # 2. Web PWA
          find all-dist/release-web-bundle -type f -name "*.zip" -exec cp {} release-assets/ServerlessLedger_3.0.0_Web_PWA.zip \;

          # 3. Windows PC (MSI 企业安装包 & EXE 安装程序)
          find all-dist/release-desktop-Windows-x64 -type f -iname "*.msi" -exec cp {} release-assets/ServerlessLedger_3.0.0_windows_x64.msi \;
          find all-dist/release-desktop-Windows-x64 -type f -iname "*.exe" -exec cp {} release-assets/ServerlessLedger_3.0.0_windows_x64.exe \;

          # 4. macOS (Apple Silicon arm64 & Intel x64)
          find all-dist/release-desktop-macOS-AppleSilicon -type f -iname "*.dmg" -exec cp {} release-assets/ServerlessLedger_3.0.0_macos_arm64.dmg \;
          find all-dist/release-desktop-macOS-Intel -type f -iname "*.dmg" -exec cp {} release-assets/ServerlessLedger_3.0.0_macos_x64.dmg \;

          # 5. Linux PC (AppImage & DEB)
          find all-dist/release-desktop-Linux-x64 -type f -iname "*.AppImage" -exec cp {} release-assets/ServerlessLedger_3.0.0_linux_x64.AppImage \;
          find all-dist/release-desktop-Linux-x64 -type f -iname "*.deb" -exec cp {} release-assets/ServerlessLedger_3.0.0_linux_x64.deb \;

          # 6. iOS (IPA 侧载包 & ZIP 归档)
          find all-dist/release-ios-bundle -type f -iname "*.ipa" -exec cp {} release-assets/ServerlessLedger_3.0.0_iOS.ipa \;
          find all-dist/release-ios-bundle -type f -iname "*.zip" -exec cp {} release-assets/ServerlessLedger_3.0.0_iOS.zip \;
          find all-dist/release-ios-bundle -type f -iname "*.tar.gz" -exec cp {} release-assets/ServerlessLedger_3.0.0_iOS_Project.tar.gz \;

          # 7. 严格移除任何潜在残余的 idsig 或 debug 文件
          rm -f release-assets/*.idsig release-assets/*debug* release-assets/*Debug*

          # 8. 生成统一 SHA-256 校验和
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: '账盾 (Serverless Ledger) 全端发布 ${{ github.ref_name || inputs.release_tag }}'
          body: |
            ## 🌟 账盾 (Serverless Ledger) 全端跨平台发布

            本版本包含了 **Web PWA、Android、iOS、PC（Windows / macOS / Linux）** 的全平台官方构建产物。

            ### 📦 下载与安装指南

            | 平台 / 系统 | 文件名 | 格式 | 说明 |
            | :--- | :--- | :--- | :--- |
            | **Windows PC** | `ServerlessLedger_3.0.0_windows_x64.msi` | `.msi` | Windows 10/11 64位 WiX 中文企业级安装包 |
            | **Windows PC** | `ServerlessLedger_3.0.0_windows_x64.exe` | `.exe` | Windows 10/11 64位 NSIS 绿色安装程序 |
            | **macOS (Apple Silicon)** | `ServerlessLedger_3.0.0_macos_arm64.dmg` | `.dmg` | 适用于 M1 / M2 / M3 / M4 芯片架构 |
            | **macOS (Intel)** | `ServerlessLedger_3.0.0_macos_x64.dmg` | `.dmg` | 适用于 Intel x86_64 芯片架构 |
            | **Linux PC** | `ServerlessLedger_3.0.0_linux_x64.AppImage` | `.AppImage` | 免安装单文件，赋予执行权限后直接运行 |
            | **Linux PC** | `ServerlessLedger_3.0.0_linux_x64.deb` | `.deb` | 适用于 Debian / Ubuntu 等 Linux 发行版 |
            | **Android App** | `ServerlessLedger_3.0.0_Android_arm64.apk` | `.apk` | **正式签名版** Android 8.0+ 安装包 |
            | **iOS App** | `ServerlessLedger_3.0.0_iOS.ipa` | `.ipa` | iOS 侧载包（支持 TrollStore / AltStore / Sideloadly） |
            | **iOS App** | `ServerlessLedger_3.0.0_iOS.zip` | `.zip` | iOS App 归档包 |
            | **Web PWA** | `ServerlessLedger_3.0.0_Web_PWA.zip` | `.zip` | Web 静态离线资源包，可直接部署在 Cloudflare Pages / Nginx |

            ### 🔒 校验和 (SHA256)
            所有发布文件的 SHA256 校验和详见附件中的 `SHA256SUMS.txt`。

            ---
            *自动化构建由 GitHub Actions 提供支持。*
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
