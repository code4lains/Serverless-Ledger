name: Build PC Desktop App (Tauri v2)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Desktop (${{ matrix.platform.os }} - ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-AppleSilicon
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux System Dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/client/src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client Dist
        run: npm run build:client

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/client
          tagName: ${{ github.ref_name }}
          releaseName: 'Serverless Ledger ${{ github.ref_name }}'
          releaseBody: '跨端极简记账应用自动化构建产物 (Serverless Ledger Multi-platform Release)'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles-${{ matrix.platform.name }}
          path: |
            packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            packages/client/src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 14
