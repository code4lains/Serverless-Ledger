name: Build Android App (Capacitor)

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, debug, release)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Platform Icons
        run: node scripts/generate-icons.mjs

      - name: Build Web Client Dist
        run: npm run build:client

      - name: Add & Sync Capacitor Android
        working-directory: packages/client
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x packages/client/android/gradlew

      # 添加签名配置
      - name: Decode Keystore
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == null
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android-release-key.jks

      - name: Build Android Debug APK
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == null
        working-directory: packages/client/android
        run: ./gradlew assembleDebug

      - name: Build Android Release APK
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == null
        working-directory: packages/client/android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sign & Prepare APK Outputs
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == null
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-apks

          # 寻找 Android Build-Tools 中的 apksigner 和 zipalign
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)"
          
          # 拷贝 Debug 包（如果存在）
          if [ -f packages/client/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp packages/client/android/app/build/outputs/apk/debug/app-debug.apk release-apks/ServerlessLedger-Android-Debug.apk
          fi

          # 对 Release 包进行 zipalign 对齐与 apksigner 签名
          UNSIGNED_APK="packages/client/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="release-apks/ServerlessLedger-Android-Release.apk"

          if [ -f "$UNSIGNED_APK" ]; then
            echo "--- 对齐 APK (zipalign) ---"
            $BUILD_TOOLS_PATH/zipalign -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK"

            echo "--- 签名 APK (apksigner) ---"
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks android-release-key.jks \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              "$SIGNED_APK"

            echo "--- 验证签名 ---"
            $BUILD_TOOLS_PATH/apksigner verify --verbose "$SIGNED_APK"
          fi

          ls -la release-apks/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*
          retention-days: 14

      - name: Upload to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}