name = "serverless-ledger-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "127.0.0.1"
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "serverless_ledger_db"
database_id = "local-d1-ledger-db"
migrations_dir = "migrations"
